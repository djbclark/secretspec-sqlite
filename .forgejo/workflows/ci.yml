name: CI

# Linux-capable part of .github/workflows/test.yml, run on SIPB Hyades
# (forgejo-ci skill). GitHub ignores this directory; the macOS and Windows
# legs of the tests matrix stay on GitHub's runners.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (fmt, clippy, test, features, package)
    runs-on: ubuntu
    # The green run 586 took 35.5 min end-to-end on Hyades; 40 was one slow
    # run away from killing a healthy job (sudo-secretspec run 585 died that
    # way). 60 leaves headroom.
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install gcc and Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq gcc libc6-dev >/dev/null
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none >/dev/null
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Install SOPS 3.13.2
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64
          chmod 0755 /usr/local/bin/sops
      # libkrun TSI: listeners bound to port 0 are unreachable on this
      # runner, which the vault/openbao mock-server tests need; preload the
      # loopback-port-shim (forgejo-ci skill section 3) for every process.
      - name: Build and preload the loopback-port-shim
        run: |
          set -euo pipefail
          gcc -shared -fPIC -O2 -pthread -o /usr/local/lib/portshim.so .forgejo/loopback-port-shim.c -ldl
          echo /usr/local/lib/portshim.so >> /etc/ld.so.preload
      # Formatting and linting are platform-independent; run them once here.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --exclude secretspec-php-native
      - name: Run tests
        run: cargo test --workspace --exclude secretspec-php-native
      # Each optional provider must compile on its own, not just in the
      # default feature set (same rationale as the GitHub job).
      - name: Check each provider feature standalone
        run: |
          set -euo pipefail
          for feature in cli keyring keeper gcsm awssm vault openbao infisical bws akv aac sops bw; do
            echo "== feature $feature"
            cargo check --package secretspec --no-default-features --features "$feature"
          done
      - name: Verify the published crate contains its schema fixture
        run: |
          set -euo pipefail
          fixture="secretspec/src/fixtures/resolution-report.schema.json"
          cmp schema/resolution-report.schema.json "$fixture"
          cargo package --package secretspec --list |
            grep -Fx 'src/fixtures/resolution-report.schema.json'
