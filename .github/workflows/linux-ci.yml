name: Linux CI

# Overlay-only workflow on ci/base. Triggered by scripts/github-ci-run, which
# pushes a commit = target tree + this overlay to ci/run/**. Upstream workflows
# are stripped from that commit so they do not run. Port of
# .forgejo/workflows/ci.yml from forgejo.mit.edu/djbclark/secretspec-sqlite;
# the loopback-port-shim is not needed on GitHub-hosted runners (no libkrun TSI).

on:
  push:
    branches: ['ci/run/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (fmt, clippy, test, features, package)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Install SOPS 3.13.2
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64
          sudo chmod 0755 /usr/local/bin/sops
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --exclude secretspec-php-native
      - name: Run tests
        run: cargo test --workspace --exclude secretspec-php-native
      - name: Check each provider feature standalone
        run: |
          set -euo pipefail
          for feature in cli keyring keeper gcsm awssm vault openbao infisical bws akv aac sops bw; do
            echo "== feature $feature"
            cargo check --package secretspec --no-default-features --features "$feature"
          done
      - name: Verify the published crate contains its schema fixture
        run: |
          set -euo pipefail
          fixture="secretspec/src/fixtures/resolution-report.schema.json"
          cmp schema/resolution-report.schema.json "$fixture"
          cargo package --package secretspec --list |
            grep -Fx 'src/fixtures/resolution-report.schema.json'
